name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: nixpkgs/nix-flakes:latest
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$(pwd)"
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin +${{ github.ref }}:refs/remotes/origin/branch
          git checkout ${{ github.sha }}
      - name: Check
        run: nix develop --command ./check.sh
      - name: Test
        run: nix develop --command ./test.sh
      - name: Build
        run: |-
          nix build
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Environment
        run: |
          sw_vers
          uname -a
          uname -m
          nix --version
      - name: Check
        run: nix develop --command ./check.sh
      - name: Test
        run: nix develop --command ./test.sh
      - name: Build
        run: nix build
